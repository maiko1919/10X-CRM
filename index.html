<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM | Login</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your CRM account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"></small>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                    <small id="passwordError"></small>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

            <p class="bottom-text">

                Don't have an account?

                <a href="signup.html">

                    Sign Up

                </a>

            </p>

        </div>

    </div>

    <script src="./js/storage.js"></script>
    <script src="./js/guard.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/login.js"></script>
    <script> redirectAuthenticatedUser();</script>

</body>
</html>
