<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>10X CRM | Clients</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <header class="navbar">

        <div class="nav-brand">
            10X CRM
        </div>

        <nav class="nav-links">
            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="clients.html"
                class="active"
            >
                Clients
            </a>

            <a href="profile.html">
                Profile
            </a>
        </nav>

        <div class="nav-actions">

            <button
                id="themeButton"
                class="small-button"
                type="button"
            >
                Theme
            </button>

            <button
                id="logoutButton"
                class="small-button danger-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>

    <main class="page-container">

        <section class="clients-heading">

            <div>
                <h1>Clients</h1>

                <p>
                    Manage your customers and sales pipeline.
                </p>
            </div>

            <button
                id="openAddClientButton"
                class="add-client-button"
                type="button"
            >
                + Add Client
            </button>

        </section>

        <section class="clients-toolbar">

            <div class="search-wrapper">

                <label
                    class="visually-hidden"
                    for="clientSearch"
                >
                    Search clients
                </label>

                <input
                    type="search"
                    id="clientSearch"
                    placeholder="Search by name or company..."
                >

            </div>

            <div
                class="filter-buttons"
                id="statusFilters"
            >

                <button
                    type="button"
                    class="filter-button active"
                    data-status="All"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-status="Lead"
                >
                    Lead
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-status="Contacted"
                >
                    Contacted
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-status="Won"
                >
                    Won
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-status="Lost"
                >
                    Lost
                </button>

            </div>

            <div class="sort-wrapper">

                <label
                    class="visually-hidden"
                    for="clientSort"
                >
                    Sort clients
                </label>

                <select id="clientSort">

                    <option value="newest">
                        Newest first
                    </option>

                    <option value="name">
                        Name A → Z
                    </option>

                    <option value="dealValue">
                        Deal value: high → low
                    </option>

                </select>

            </div>

        </section>

        <section id="clientsState">

            <div
                id="clientsLoading"
                class="state-message"
            >
                Loading clients...
            </div>

            <div
                id="clientsError"
                class="state-message hidden"
            >
                <p>
                    Could not load clients. Check your connection and try again.
                </p>

                <button
                    id="retryClientsButton"
                    class="small-button"
                    type="button"
                >
                    Retry
                </button>
            </div>

            <div
                id="clientsEmpty"
                class="state-message hidden"
            >
                No clients found.
            </div>

        </section>

        <section
            id="clientsList"
            class="clients-grid"
        ></section>

    </main>

    <!-- Add Client Modal -->

    <div
        id="addClientModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addClientModalTitle"
    >

        <div class="modal-overlay"></div>

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="addClientModalTitle">
                    Add Client
                </h2>

                <button
                    id="closeAddClientButton"
                    class="close-button"
                    type="button"
                    aria-label="Close modal"
                >
                    ×
                </button>

            </div>

            <form id="addClientForm">

                <div class="form-group">

                    <label for="clientName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="clientName"
                        placeholder="Enter client name"
                    >

                    <small id="clientNameError"></small>

                </div>

                <div class="form-group">

                    <label for="clientEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="clientEmail"
                        placeholder="Enter client email"
                    >

                    <small id="clientEmailError"></small>

                </div>

                <div class="form-group">

                    <label for="clientPhone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="clientPhone"
                        placeholder="Enter phone number"
                    >

                    <small id="clientPhoneError"></small>

                </div>

                <div class="form-group">

                    <label for="clientCompany">
                        Company
                    </label>

                    <input
                        type="text"
                        id="clientCompany"
                        placeholder="Enter company name"
                    >

                    <small id="clientCompanyError"></small>

                </div>

                <div class="form-group">

                    <label for="clientDealValue">
                        Deal Value
                    </label>

                    <input
                        type="number"
                        id="clientDealValue"
                        min="1"
                        placeholder="Enter deal value"
                    >

                    <small id="clientDealValueError"></small>

                </div>

                <div class="form-group">

                    <label for="clientStatus">
                        Status
                    </label>

                    <select id="clientStatus">

                        <option value="Lead">
                            Lead
                        </option>

                        <option value="Contacted">
                            Contacted
                        </option>

                        <option value="Won">
                            Won
                        </option>

                        <option value="Lost">
                            Lost
                        </option>

                    </select>

                    <small id="clientStatusError"></small>

                </div>

                <div class="modal-actions">

                    <button
                        id="cancelAddClientButton"
                        class="secondary-button"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Add Client
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Client Details Modal -->

    <div
        id="clientDetailsModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="clientDetailsTitle"
    >

        <div class="modal-overlay"></div>

        <div class="modal-content details-modal-content">

            <div class="modal-header">

                <h2 id="clientDetailsTitle">
                    Client Details
                </h2>

                <button
                    id="closeClientDetailsButton"
                    class="close-button"
                    type="button"
                    aria-label="Close modal"
                >
                    ×
                </button>

            </div>

            <div id="clientDetailsContent"></div>

            <section class="notes-section">

                <h3>Notes</h3>

                <form id="noteForm">

                    <div class="form-group">

                        <label
                            class="visually-hidden"
                            for="noteText"
                        >
                            Add note
                        </label>

                        <textarea
                            id="noteText"
                            rows="3"
                            placeholder="Write a note..."
                        ></textarea>

                        <small id="noteError"></small>

                    </div>

                    <button type="submit">
                        Add Note
                    </button>

                </form>

                <div id="notesList"></div>

            </section>

            <button
                id="reminderButton"
                class="reminder-button"
                type="button"
            >
                Remind me in 1 min
            </button>

        </div>

    </div>

    <div id="toastContainer"></div>

    <script src="./js/storage.js"></script>
    <script src="./js/guard.js"></script>

    <script>
        protectPage();
    </script>

    <script src="./js/common.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/clients.js"></script>

</body>
</html>
